:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plum:#151D1A; --plum-soft:#2A3830;
    --paper:#111714; --paper-2:#1B2521; --card:#18211D;
    --line:#2C3A33; --skin:#8FA98A;
    --ink:#E9F0E9; --ink-2:#8FA096;
    --due:#F08A72; --paid:#8CD16A; --gold:#F2C230;
  }
}
:root[data-theme="dark"]{
  --plum:#151D1A; --plum-soft:#2A3830;
  --paper:#111714; --paper-2:#1B2521; --card:#18211D;
  --line:#2C3A33; --skin:#8FA98A;
  --ink:#E9F0E9; --ink-2:#8FA096;
  --due:#F08A72; --paid:#8CD16A; --gold:#F2C230;
}
.logo{width:74px;height:37px;background:var(--logo) center/contain no-repeat;flex:0 0 auto}
.logo.big{width:148px;height:75px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column}
.top{background:var(--plum);color:#FFF1EA;padding:14px 18px 16px;position:sticky;top:0;z-index:20}
.top .brand{display:flex;align-items:center;gap:11px}
.top h1{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;margin:0;letter-spacing:-0.02em}
.top .sub{color:#D9A79E;font-size:12.5px;margin-top:1px}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#FFF1EA;width:34px;height:34px;border-radius:10px;font-size:15px;display:grid;place-items:center}
main{flex:1;padding:14px 14px 96px}
section[hidden]{display:none}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 2px 11px;color:var(--ink-2);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:17px;font-weight:400;line-height:1}
nav button[aria-current="true"]{color:var(--paid);font-weight:600}
nav button[aria-current="true"] b{transform:translateY(-1px)}

/* hero */
.hero{background:var(--plum);color:#FFF1EA;border-radius:16px;padding:18px 18px 16px;margin-bottom:14px}
.hero .cap{color:var(--skin);font-size:13px}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;margin:4px 0 2px}
.hero .meta{color:var(--skin);font-size:12.5px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.split div{background:rgba(255,255,255,.07);border-radius:10px;padding:9px 11px}
.split span{display:block;color:var(--skin);font-size:12px}
.split strong{font-size:19px;font-weight:700}

/* generic */
h2{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;margin:20px 0 8px;letter-spacing:-0.01em}
h2:first-child{margin-top:4px}
.muted{color:var(--ink-2);font-size:13px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{display:block;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-size:16px;white-space:nowrap}
.amt.due{color:var(--due)} .amt.paid{color:var(--paid)} .amt.zero{color:var(--ink-2)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.pill.hot{color:var(--due);border-color:var(--due)}
.pill.ok{color:var(--paid);border-color:var(--paid)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

/* forms */
label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px}
input[type=number]{font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--plum);color:#FFF1EA;border-color:var(--plum)}
.total{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.total span{font-size:13px;color:var(--ink-2)}
.total b{font-size:26px;font-weight:800}
.go{width:100%;margin-top:14px;background:var(--gold);color:#1B2320;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600}
.go.green{background:var(--paid)}
.go.ghost{background:none;color:var(--ink-2);border:1px solid var(--line);font-weight:500;padding:11px}
.warn{margin-top:10px;border-left:3px solid var(--gold);background:var(--paper-2);padding:9px 12px;border-radius:0 10px 10px 0;font-size:13px}
.search{margin-bottom:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,5,12,.55);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-radius:20px 20px 0 0;
  max-width:520px;margin:0 auto;max-height:90vh;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 10px}
.sheet h3{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;margin:0 0 2px;letter-spacing:-0.02em}
.ledger{margin-top:12px;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.lrow .d{font-size:11.5px;color:var(--ink-2)}
.lrow .t{font-size:13.5px}
.lrow .t em{font-style:normal;color:var(--ink-2);font-size:12px;display:block}
.lrow .v{text-align:right;font-weight:600;font-size:14px}
.lrow .v small{display:block;font-weight:400;color:var(--ink-2);font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--plum);color:#FFF1EA;
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.tablines{width:100%;border-collapse:collapse;font-size:13.5px}
.tablines th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.tablines td{padding:7px 0;border-bottom:1px solid var(--line)}
.tablines td:last-child,.tablines th:last-child{text-align:right}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" role="img" aria-label="Antz and Beez"></div>
      <div style="flex:1;min-width:0">
        <h1 id="bizName">Antz and Beez</h1>
        <div class="sub" id="bizSub">Global Logistics Pvt Ltd</div>
      </div>
      <button class="iconbtn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <main>
    <section id="s-today"></section>
    <section id="s-collect" hidden></section>
    <section id="s-sale" hidden></section>
    <section id="s-customers" hidden></section>
    <section id="s-books" hidden></section>
  </main>

  <nav>
    <button data-tab="today" aria-current="true"><b>▦</b>Today</button>
    <button data-tab="collect"><b>₹</b>Collect</button>
    <button data-tab="sale"><b>◉</b>New load</button>
    <button data-tab="customers"><b>☷</b>Shops</button>
    <button data-tab="books"><b>▤</b>Books</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
const today = () => new Date().toISOString().slice(0,10);
const dmy = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return dd+'/'+m; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }

/* ---------- state ---------- */
const S = {
  tab:'today',
  customers:[],          // {id,name,shop,area,phone,limit,opening,createdAt,active}
  ledger:{},             // docId -> {cid, month, entries:[...]}
  settings:{biz:'Antz and Beez', line:'Global Logistics Pvt Ltd', bag:50, rate:0},
  canWrite:true,
  mode:'local'
};
const VARIETIES = ['Bellary','Sambar (small)','Pearl','Spring'];

/* ---------- storage adapter: claude db, else localStorage ---------- */
const Store = {
  db:null,
  async init(onReady){
    try{ if(window.claude && window.claude.use){ this.db = await window.claude.use('db'); } }catch(e){ this.db=null; }
    try{
      const u = window.claude && window.claude.use ? await window.claude.use('user') : null;
      if(u){ const w = await u.can('data.write'); if(w===false) S.canWrite=false; }
    }catch(e){}
    if(this.db){
      S.mode='cloud';
      this.db.collection('customers').onSnapshot(snap=>{
        S.customers = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
        onReady();
      }, e=>{ console.warn('customers',e); });
      this.db.collection('ledger').onSnapshot(snap=>{
        const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); });
        S.ledger=m; onReady();
      }, e=>{ console.warn('ledger',e); });
      this.db.doc('meta/settings').onSnapshot(snap=>{
        if(snap.exists){ const d=snap.data(); if(d.biz==='Mandi Book'){ delete d.biz; delete d.line; } S.settings = Object.assign(S.settings, d); }
        onReady();
      }, ()=>{});
    }else{
      S.mode='local';
      this.load(); onReady();
    }
  },
  load(){
    try{
      const raw = localStorage.getItem('anbledger');
      if(raw){ const d = JSON.parse(raw); S.customers=d.customers||[]; S.ledger=d.ledger||{}; S.settings=Object.assign(S.settings,d.settings||{}); }
    }catch(e){}
  },
  persistLocal(){
    try{ localStorage.setItem('anbledger', JSON.stringify({customers:S.customers, ledger:S.ledger, settings:S.settings})); }
    catch(e){ toast('Could not save on this device'); }
  },
  async saveCustomer(c){
    if(this.db){ try{ const {id,...rest}=c; await this.db.doc('customers/'+id).set(rest); }
      catch(e){ if(e&&e.code==='invalid_argument'){S.canWrite=false;} toast('Not saved — no write access'); } }
    else this.persistLocal();
  },
  async deleteCustomer(id){
    if(this.db){ try{ await this.db.doc('customers/'+id).delete(); }catch(e){ toast('Could not delete'); } }
    else this.persistLocal();
  },
  async saveLedger(docId, doc){
    if(this.db){ try{ await this.db.doc('ledger/'+docId).set(doc); }
      catch(e){ toast('Entry not saved — try again'); } }
    else this.persistLocal();
  },
  async saveSettings(){
    if(this.db){ try{ await this.db.doc('meta/settings').set(S.settings); }catch(e){} }
    else this.persistLocal();
  }
};

/* ---------- ledger maths ---------- */
function docIdFor(cid, date){ return cid + '-' + date.slice(0,7).replace('-',''); }
function entriesOf(cid){
  const out=[];
  Object.keys(S.ledger).forEach(k=>{ const d=S.ledger[k]; if(d && d.cid===cid && Array.isArray(d.entries)) out.push(...d.entries); });
  return out.sort((a,b)=> (a.date===b.date ? (a.ts||0)-(b.ts||0) : a.date.localeCompare(b.date)));
}
function allEntries(){
  const out=[];
  Object.keys(S.ledger).forEach(k=>{ const d=S.ledger[k]; if(d&&Array.isArray(d.entries)) d.entries.forEach(e=>out.push(Object.assign({cid:d.cid},e))); });
  return out.sort((a,b)=> (a.date===b.date ? (b.ts||0)-(a.ts||0) : b.date.localeCompare(a.date)));
}
// sale & adjust add to what the shop owes; payment & return reduce it
function signed(e){ return (e.type==='sale'||e.type==='adjust') ? Number(e.amount)||0 : -(Number(e.amount)||0); }
function balanceOf(cid){
  const c = S.customers.find(x=>x.id===cid);
  let b = c ? (Number(c.opening)||0) : 0;
  entriesOf(cid).forEach(e=> b += signed(e));
  return b;
}
function lastPaidDate(cid){
  const p = entriesOf(cid).filter(e=>e.type==='payment');
  return p.length ? p[p.length-1].date : null;
}
function totalOutstanding(){ return S.customers.reduce((s,c)=> s + balanceOf(c.id), 0); }
function dayTotals(date){
  let sale=0, pay=0, kg=0;
  allEntries().forEach(e=>{ if(e.date!==date) return;
    if(e.type==='sale'){ sale+=Number(e.amount)||0; kg+=Number(e.qty)||0; }
    else if(e.type==='payment'){ pay+=Number(e.amount)||0; } });
  return {sale,pay,kg};
}
function custName(cid){ const c=S.customers.find(x=>x.id===cid); return c? c.name : 'Deleted shop'; }

/* ---------- writes ---------- */
async function addEntry(cid, entry){
  entry.id = entry.id || uid('e');
  entry.ts = Date.now();
  const did = docIdFor(cid, entry.date);
  const doc = S.ledger[did] ? JSON.parse(JSON.stringify(S.ledger[did])) : {cid, month:entry.date.slice(0,7), entries:[]};
  doc.entries.push(entry);
  S.ledger[did]=doc;
  render();
  await Store.saveLedger(did, doc);
}
async function removeEntry(cid, entryId, date){
  const did = docIdFor(cid, date);
  const doc = S.ledger[did]; if(!doc) return;
  const nd = {cid:doc.cid, month:doc.month, entries: doc.entries.filter(e=>e.id!==entryId)};
  S.ledger[did]=nd; render();
  await Store.saveLedger(did, nd);
}
async function upsertCustomer(c){
  const i = S.customers.findIndex(x=>x.id===c.id);
  if(i>=0) S.customers[i]=c; else S.customers.push(c);
  render();
  await Store.saveCustomer(c);
}

/* ---------- sheet ---------- */
function openSheet(html){ $('#sheetBody').innerHTML=''; $('#sheetBody').appendChild(el(html)); $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').addEventListener('click', closeSheet);

/* ================= SCREENS ================= */

function viewToday(){
  const out = totalOutstanding();
  const t = dayTotals(today());
  const dues = S.customers.map(c=>({c, b:balanceOf(c.id)})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  const overdue = dues.filter(x=>{ const lp=lastPaidDate(x.c.id); return !lp || daysBetween(lp, today())>=3; });
  const recent = allEntries().slice(0,8);

  let h = `<div>
    <div class="hero">
      <div class="cap">Money on the street</div>
      <div class="big num">${money(out)}</div>
      <div class="meta">${dues.length} shop${dues.length===1?'':'s'} carrying a balance${overdue.length?` · ${overdue.length} not paid in 3+ days`:''}</div>
      <div class="split">
        <div><span>Sent out today</span><strong class="num">${money(t.sale)}</strong></div>
        <div><span>Collected today</span><strong class="num">${money(t.pay)}</strong></div>
      </div>
    </div>`;

  if(!S.customers.length){
    h += `<div class="empty"><div class="logo big" style="margin:0 auto 10px"></div><b>Start with your shops</b>Add the retailers and hotels you supply, then record each load and each collection against them.
      <button class="go" data-act="tab" data-v="customers" style="margin-top:14px">Add first shop</button>
      <button class="go ghost" data-act="demo">Load 13 sample shops to explore</button></div>`;
  } else {
    h += `<h2>Chase these first</h2>`;
    const list = (overdue.length?overdue:dues).slice(0,5);
    h += `<div class="rows">` + list.map(x=>{
      const lp=lastPaidDate(x.c.id);
      const gap = lp? daysBetween(lp,today()) : null;
      return `<button class="row" data-act="cust" data-v="${x.c.id}">
        <div class="who"><b>${esc(x.c.name)}</b><span>${esc(x.c.area||x.c.shop||'')}${gap!=null?` · paid ${gap===0?'today':gap+'d ago'}`:' · never paid'}</span></div>
        <div class="amt due num">${money(x.b)}</div></button>`;
    }).join('') + `</div>`;

    h += `<h2>Recent entries</h2>`;
    h += recent.length ? `<div class="rows">` + recent.map(e=>`
      <button class="row" data-act="cust" data-v="${e.cid}">
        <div class="who"><b>${esc(custName(e.cid))}</b><span>${dmy(e.date)} · ${e.type==='sale'?`${e.qty||0} kg @ ₹${e.rate||0}`:(e.type==='payment'?('collection · '+esc(e.mode||'cash')):esc(e.type))}</span></div>
        <div class="amt num ${e.type==='sale'?'due':(e.type==='payment'?'paid':'zero')}">${e.type==='sale'?'+':'−'}${money(e.amount)}</div>
      </button>`).join('') + `</div>` : `<div class="empty">Nothing recorded yet today.</div>`;
  }
  h += `</div>`;
  return h;
}

function viewCollect(){
  const q = (S._cq||'').toLowerCase();
  let dues = S.customers.map(c=>({c,b:balanceOf(c.id)})).filter(x=>x.b>0.5);
  if(q) dues = dues.filter(x=> (x.c.name+' '+(x.c.area||'')+' '+(x.c.shop||'')).toLowerCase().includes(q));
  dues.sort((a,b)=>b.b-a.b);
  const t = dayTotals(today());
  const paidToday = new Set(allEntries().filter(e=>e.date===today()&&e.type==='payment').map(e=>e.cid));

  let h = `<div>
    <div class="hero" style="padding:14px 16px">
      <div class="cap">Collected today</div>
      <div class="big num" style="font-size:32px">${money(t.pay)}</div>
      <div class="meta">${paidToday.size} of ${dues.length + paidToday.size} shops covered</div>
    </div>
    <input class="search" id="cq" placeholder="Search shop or area" value="${esc(S._cq||'')}">`;

  if(!dues.length){
    h += `<div class="empty"><b>Nothing pending</b>Every shop is settled, or you haven't recorded any loads yet.</div>`;
  } else {
    h += `<div class="rows">` + dues.map(x=>{
      const lp = lastPaidDate(x.c.id);
      const gap = lp? daysBetween(lp,today()) : null;
      const hot = gap===null || gap>=3;
      return `<button class="row" data-act="pay" data-v="${x.c.id}">
        <div class="who"><b>${esc(x.c.name)}</b><span>${esc(x.c.area||'—')} ${paidToday.has(x.c.id)?'· <span class="pill ok">paid today</span>':(hot?'· <span class="pill hot">'+(gap===null?'never paid':gap+' days')+'</span>':'')}</span></div>
        <div class="amt due num">${money(x.b)}</div></button>`;
    }).join('') + `</div>
    <p class="muted" style="margin-top:10px">Tap a shop to enter what you collected. Part payments are fine — the balance carries forward.</p>`;
  }
  return h + `</div>`;
}

function viewSale(){
  const d = S._sale || (S._sale = {cid:'', date:today(), unit:'bag', bags:'', bagkg:S.settings.bag||50, kg:'', rate:S.settings.rate||'', variety:'Bellary', note:''});
  const kgs = d.unit==='bag' ? (Number(d.bags)||0)*(Number(d.bagkg)||0) : (Number(d.kg)||0);
  const amount = kgs * (Number(d.rate)||0);
  const cust = S.customers.find(c=>c.id===d.cid);
  const bal = cust? balanceOf(cust.id) : 0;
  const over = cust && Number(cust.limit)>0 && (bal+amount) > Number(cust.limit);

  return `<div>
    <h2>Record a load</h2>
    ${!S.customers.length?`<div class="empty"><b>No shops yet</b>Add a shop first, then you can send loads against it.
      <button class="go" data-act="tab" data-v="customers" style="margin-top:12px">Go to shops</button></div>`:`
    <label for="f-cid">Shop</label>
    <select id="f-cid" data-f="cid">
      <option value="">Choose a shop</option>
      ${S.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===d.cid?'selected':''}>${esc(c.name)}${c.area?' — '+esc(c.area):''}</option>`).join('')}
    </select>

    <label>Quantity</label>
    <div class="chips">
      <button class="chip" data-f="unit" data-v="bag" aria-pressed="${d.unit==='bag'}">Bags</button>
      <button class="chip" data-f="unit" data-v="kg" aria-pressed="${d.unit==='kg'}">Loose kg</button>
    </div>
    ${d.unit==='bag'
      ? `<div class="two" style="margin-top:8px">
           <input type="number" inputmode="decimal" placeholder="Bags" data-f="bags" value="${esc(d.bags)}">
           <input type="number" inputmode="decimal" placeholder="kg per bag" data-f="bagkg" value="${esc(d.bagkg)}">
         </div>`
      : `<input type="number" inputmode="decimal" placeholder="Total kg" data-f="kg" value="${esc(d.kg)}" style="margin-top:8px">`}

    <div class="two">
      <div><label for="f-rate">Rate per kg</label><input id="f-rate" type="number" inputmode="decimal" placeholder="₹" data-f="rate" value="${esc(d.rate)}"></div>
      <div><label for="f-date">Date</label><input id="f-date" type="date" data-f="date" value="${d.date}"></div>
    </div>

    <label>Variety</label>
    <div class="chips">${VARIETIES.map(v=>`<button class="chip" data-f="variety" data-v="${v}" aria-pressed="${d.variety===v}">${v}</button>`).join('')}</div>

    <label for="f-note">Note (vehicle, lot, anything)</label>
    <input id="f-note" data-f="note" value="${esc(d.note)}" placeholder="Optional">

    <div class="total"><span>${kgs.toLocaleString('en-IN')} kg × ₹${Number(d.rate)||0}</span><b class="num">${money(amount)}</b></div>
    ${cust?`<p class="muted" style="margin-top:8px">${esc(cust.name)} owes ${money(bal)} now → ${money(bal+amount)} after this load.</p>`:''}
    ${over?`<div class="warn">This crosses the credit limit of ${money(cust.limit)} you set for ${esc(cust.name)}. Send it only if you're comfortable.</div>`:''}
    <button class="go" data-act="saveSale" ${(!d.cid||!amount)?'disabled style="opacity:.45"':''}>Save load</button>
    `}
  </div>`;
}

function viewCustomers(){
  const q=(S._kq||'').toLowerCase();
  let list = S.customers.slice();
  if(q) list = list.filter(c=>(c.name+' '+(c.area||'')+' '+(c.phone||'')+' '+(c.shop||'')).toLowerCase().includes(q));
  list.sort((a,b)=> balanceOf(b.id)-balanceOf(a.id) || a.name.localeCompare(b.name));

  let h = `<div>
    <h2>Shops you supply <span class="muted">· ${S.customers.length}</span></h2>
    <input class="search" id="kq" placeholder="Search name, area or phone" value="${esc(S._kq||'')}">`;
  h += list.length ? `<div class="rows">` + list.map(c=>{
      const b=balanceOf(c.id);
      return `<button class="row" data-act="cust" data-v="${c.id}">
        <div class="who"><b>${esc(c.name)}</b><span>${esc(c.shop||'')}${c.shop&&c.area?' · ':''}${esc(c.area||'')}${c.phone?' · '+esc(c.phone):''}</span></div>
        <div class="amt num ${b>0.5?'due':(b<-0.5?'paid':'zero')}">${b<-0.5?'advance ':''}${money(Math.abs(b))}</div></button>`;
    }).join('') + `</div>`
    : `<div class="empty"><b>No shops yet</b>Add the retailers, hotels and pushcart vendors you give stock to.</div>`;
  h += `<button class="go" data-act="newCust" style="margin-top:14px">Add a shop</button>`;
  if(!S.customers.length) h += `<button class="go ghost" data-act="demo">Load 13 sample shops to explore</button>`;
  return h + `</div>`;
}

function viewBooks(){
  const r = S._range || (S._range = {from: today().slice(0,8)+'01', to: today()});
  const ent = allEntries().filter(e=> e.date>=r.from && e.date<=r.to);
  const sale = ent.filter(e=>e.type==='sale').reduce((s,e)=>s+(+e.amount||0),0);
  const pay = ent.filter(e=>e.type==='payment').reduce((s,e)=>s+(+e.amount||0),0);
  const kg = ent.filter(e=>e.type==='sale').reduce((s,e)=>s+(+e.qty||0),0);
  const rates = ent.filter(e=>e.type==='sale'&&e.rate);
  const avg = rates.length ? rates.reduce((s,e)=>s+(+e.rate),0)/rates.length : 0;

  // per-day roll-up
  const byDay={};
  ent.forEach(e=>{ byDay[e.date]=byDay[e.date]||{sale:0,pay:0}; byDay[e.date][e.type==='sale'?'sale':(e.type==='payment'?'pay':'sale')] += (+e.amount||0); });
  const days = Object.keys(byDay).sort().reverse();

  return `<div>
    <h2>Day book</h2>
    <div class="two">
      <div><label for="f-from">From</label><input id="f-from" type="date" data-r="from" value="${r.from}"></div>
      <div><label for="f-to">To</label><input id="f-to" type="date" data-r="to" value="${r.to}"></div>
    </div>
    <div class="split" style="margin-top:14px">
      <div style="background:var(--paper-2);border:1px solid var(--line)"><span class="muted">Stock sent</span><strong class="num">${money(sale)}</strong></div>
      <div style="background:var(--paper-2);border:1px solid var(--line)"><span class="muted">Cash collected</span><strong class="num">${money(pay)}</strong></div>
    </div>
    <p class="muted" style="margin-top:10px">${kg.toLocaleString('en-IN')} kg moved${avg?` · average rate ₹${avg.toFixed(2)}/kg`:''} · closing dues ${money(totalOutstanding())}</p>

    ${days.length?`<table class="tablines" style="margin-top:14px"><tr><th>Date</th><th>Sent</th><th>Collected</th></tr>
      ${days.map(d=>`<tr><td>${dmy(d)}</td><td class="num">${money(byDay[d].sale)}</td><td class="num">${money(byDay[d].pay)}</td></tr>`).join('')}
    </table>`:`<div class="empty" style="margin-top:14px">No entries in this range.</div>`}

    <h2>Outstanding by shop</h2>
    ${S.customers.length?`<table class="tablines"><tr><th>Shop</th><th>Last paid</th><th>Balance</th></tr>
      ${S.customers.map(c=>({c,b:balanceOf(c.id)})).sort((a,b)=>b.b-a.b).map(x=>{
        const lp=lastPaidDate(x.c.id);
        return `<tr><td>${esc(x.c.name)}</td><td class="muted">${lp?dmy(lp):'—'}</td><td class="num" style="color:${x.b>0.5?'var(--due)':'var(--ink-2)'}">${money(x.b)}</td></tr>`;
      }).join('')}</table>`:`<div class="empty">Add shops to see this.</div>`}

    <button class="go ghost" data-act="csv" style="margin-top:16px">Export these entries as CSV</button>
    <button class="go ghost" data-act="csvDues">Export outstanding list as CSV</button>
  </div>`;
}

/* ---------- customer sheet ---------- */
function sheetCustomer(cid){
  const c = S.customers.find(x=>x.id===cid); if(!c) return;
  const ent = entriesOf(cid).slice().reverse();
  const bal = balanceOf(cid);
  const lp = lastPaidDate(cid);
  let running = bal;
  const rows = ent.map(e=>{
    const shown = running;
    running = running - signed(e);
    return `<div class="lrow">
      <div class="d num">${dmy(e.date)}</div>
      <div class="t">${e.type==='sale'?'Load sent':(e.type==='payment'?'Payment received':(e.type==='return'?'Return / short':'Adjustment'))}
        <em>${e.type==='sale'?`${e.qty||0} kg @ ₹${e.rate||0}${e.variety?' · '+esc(e.variety):''}`:esc(e.mode||e.note||'')}${e.type==='sale'&&e.note?' · '+esc(e.note):''}</em></div>
      <div class="v num" style="color:${signed(e)>0?'var(--due)':'var(--paid)'}">${signed(e)>0?'+':'−'}${money(Math.abs(e.amount))}
        <small>bal ${money(shown)}</small></div>
    </div>`;
  }).join('');

  openSheet(`<div>
    <h3>${esc(c.name)}</h3>
    <div class="muted">${esc([c.shop,c.area,c.phone].filter(Boolean).join(' · ')) || 'No contact details'}</div>

/* ---------- CSV ---------- */
function csvEscape(v){ v=String(v==null?'':v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
async function offerCSV(filename, rows){
  const text = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  let dl=null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename, data:text}); toast('Saved '+filename); return; }catch(e){}
  }
  openSheet(`<div><h3>${esc(filename)}</h3><div class="muted">Copy this into a spreadsheet.</div>
    <textarea rows="12" style="margin-top:10px;font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea>
    <button class="go" id="cp">Copy to clipboard</button></div>`);
  $('#cp').addEventListener('click', ()=>{
    const ta=$('#sheetBody textarea'); ta.select();
    try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); }
    toast('Copied');
  });
}

/* ---------- statement text ---------- */
function statementText(cid){
  const c=S.customers.find(x=>x.id===cid);
  const ent=entriesOf(cid).slice(-12);
  const lines=[`${S.settings.biz} — statement for ${c.name}`,''];
  ent.forEach(e=> lines.push(`${dmy(e.date)}  ${e.type==='sale'?`load ${e.qty||0}kg @${e.rate||0}`:(e.type==='payment'?`paid (${e.mode||'cash'})`:'adjustment')}  ${signed(e)>0?'+':'-'}${money(Math.abs(e.amount))}`));
  lines.push('', `Balance due: ${money(balanceOf(cid))}`);
  return lines.join('\n');
}

const DEMO_RATES = [26,26.5,27,28,27.5,29,30,31,30.5,29.5,31,32,33,32.5,31.5,30,29,28.5,30,31.5,33,34,33.5,32];

async function loadDemo(){
  let s = 20260918;
  const rnd = () => (s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const pick = (a,b) => a + Math.floor(rnd()*(b-a+1));
  const DAYS = DEMO_RATES.length;                       // last 24 days
  const base = new Date(); base.setHours(12,0,0,0);
  const dayStr = n => { const x=new Date(base); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); };

  const made = [], ledger = {};
  let tick = Date.now() - 1e7;
  const push = (cid, e) => {
    e.id = uid('e'); e.ts = tick++;
    const did = docIdFor(cid, e.date);
    (ledger[did] = ledger[did] || {cid, month:e.date.slice(0,7), entries:[]}).entries.push(e);
  };

  DEMO.forEach(p => {
    const c = {id:uid('c'), name:p.name, shop:p.shop, area:p.area, phone:p.phone,
               limit:p.limit, opening:p.opening, createdAt:dayStr(DAYS+10), active:true};
    made.push(c);
    let bal = p.opening;
    const pending = [];                                  // payments scheduled for later days

    for (let n = DAYS-1; n >= 0; n--) {
      const date = dayStr(n);
      const dow = new Date(date).getDay();

      // settle anything scheduled for today
      for (let i = pending.length-1; i >= 0; i--) {
        if (pending[i].on >= n) {
          const amt = Math.min(bal, pending[i].amt);
          if (amt > 100) {
            const mode = p.style==='daily' ? 'cash' : (rnd()<0.55?'cash':(rnd()<0.6?'UPI':'bank'));
            push(c.id, {type:'payment', date, amount:Math.round(amt/10)*10, mode, note:''});
            bal -= Math.round(amt/10)*10;
          }
          pending.splice(i,1);
        }
      }

      // a load goes out?
      const send = (n % p.every === 0) && !(dow===0 && p.style!=='daily') && rnd() < 0.88;
      if (send && n > 0) {
        const bags = pick(p.bags[0], p.bags[1]);
        const kgPerBag = p.style==='daily' ? 25 : 50;
        const rate = DEMO_RATES[DAYS-1-n] + (p.style==='bulk' ? -1 : 0);
        const qty = bags * kgPerBag;
        const amount = Math.round(qty * rate);
        const variety = rnd()<0.62 ? 'Bellary' : (rnd()<0.6 ? 'Sambar (small)' : 'Pearl');
        push(c.id, {type:'sale', date, qty, rate, amount, variety,
                    note: bags>=20 ? `${bags} bags · lorry TN 11 ${pick(1000,9999)}` : `${bags} bags`});
        bal += amount;
        if (p.style !== 'defaulter' || rnd() < 0.35) {
          pending.push({on: Math.max(0, n - p.payDelay), amt: amount * p.payRate * (0.8 + rnd()*0.4)});
        }
      }

      // occasional return / weight short
      if (rnd() < 0.035 && bal > 2000) {
        const amt = pick(2,9) * 100;
        push(c.id, {type:'return', date, amount:amt, note: rnd()<0.5 ? `${pick(8,25)} kg spoiled` : 'weight short'});
        bal -= amt;
      }
    }
  });

  S.customers = S.customers.concat(made);
  Object.assign(S.ledger, ledger);
  S.settings.rate = DEMO_RATES[DEMO_RATES.length-1];
  S.settings.bag = 50;
  closeSheet(); render(); toast('Loading 13 shops…');

  for (const c of made) await Store.saveCustomer(c);
  for (const k of Object.keys(ledger)) await Store.saveLedger(k, ledger[k]);
  await Store.saveSettings();
  render();
  toast('13 shops · ' + Object.keys(ledger).reduce((n,k)=>n+ledger[k].entries.length,0) + ' entries loaded');
}

/* ---------- render + events ---------- */
function render(){
  $('#bizName').textContent = S.settings.biz || 'Antz and Beez';
  $('#bizSub').textContent = S.settings.line || '';
  const map = {today:viewToday, collect:viewCollect, sale:viewSale, customers:viewCustomers, books:viewBooks};
  ['today','collect','sale','customers','books'].forEach(t=>{
    const sec = $('#s-'+t);
    sec.hidden = (t!==S.tab);
    if(t===S.tab){ sec.innerHTML=''; sec.appendChild(el(map[t]())); }
  });
  document.querySelectorAll('nav button').forEach(b=> b.setAttribute('aria-current', String(b.dataset.tab===S.tab)));
  if(!S.canWrite){
    const m=$('#s-'+S.tab);
    m.insertBefore(el(`<div class="warn">You can view this book but not change it. Ask the owner for edit access.</div>`), m.firstChild);
    m.querySelectorAll('button.go, input, select').forEach(x=>x.disabled=true);
  }
}

document.querySelectorAll('nav button').forEach(b=> b.addEventListener('click',()=>{ S.tab=b.dataset.tab; window.scrollTo(0,0); render(); }));
$('#settingsBtn').addEventListener('click', sheetSettings);

document.addEventListener('click', async (ev)=>{
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const v = t.dataset.v;
  switch(t.dataset.act){
    case 'tab': S.tab=v; render(); break;
    case 'cust': sheetCustomer(v); break;
    case 'pay': sheetPayment(v); break;
    case 'return': sheetReturn(v); break;
    case 'newCust': sheetCustomerForm(null); break;
    case 'editCust': sheetCustomerForm(v); break;
    case 'demo': t.disabled=true; t.textContent='Loading…'; await loadDemo(); break;
    case 'loadFor': closeSheet(); S._sale=Object.assign(S._sale||{},{cid:v,date:today(),unit:'bag',bagkg:S.settings.bag||50,bags:'',kg:'',rate:S.settings.rate||'',variety:'Bellary',note:''}); S.tab='sale'; render(); break;
    case 'copyStmt': {
      const txt=statementText(v);
      try{ await navigator.clipboard.writeText(txt); toast('Statement copied'); }
      catch(e){ openSheet(`<div><h3>Statement</h3><textarea rows="12" style="margin-top:10px">${esc(txt)}</textarea></div>`); }
      break;
    }
    case 'undoLast': {
      const e = entriesOf(v).slice(-1)[0]; if(!e) break;
      if(confirm('Delete the latest entry for this shop?')){ closeSheet(); await removeEntry(v,e.id,e.date); toast('Entry deleted'); }
      break;
    }
    case 'saveSale': {
      const d=S._sale;
      const kgs = d.unit==='bag' ? (Number(d.bags)||0)*(Number(d.bagkg)||0) : (Number(d.kg)||0);
      const amount = kgs*(Number(d.rate)||0);
      if(!d.cid || !amount){ toast('Pick a shop, quantity and rate'); break; }
      await addEntry(d.cid,{type:'sale',date:d.date,qty:kgs,rate:Number(d.rate),amount,variety:d.variety,note:d.note});
      S.settings.rate=Number(d.rate); S.settings.bag=Number(d.bagkg)||S.settings.bag; Store.saveSettings();
      const nm=custName(d.cid);
      S._sale={cid:'',date:today(),unit:d.unit,bags:'',bagkg:d.bagkg,kg:'',rate:d.rate,variety:d.variety,note:''};
      render(); toast(money(amount)+' load to '+nm);
      break;
    }
    case 'csv': {
      const r=S._range;
      const rows=[['Date','Shop','Type','Qty kg','Rate','Amount','Mode/Note']];
      allEntries().filter(e=>e.date>=r.from&&e.date<=r.to).reverse().forEach(e=>
        rows.push([e.date,custName(e.cid),e.type,e.qty||'',e.rate||'',e.amount,e.mode||e.note||'']));
      offerCSV('daybook-'+r.from+'-to-'+r.to+'.csv', rows); break;
    }
    case 'csvDues': {
      const rows=[['Shop','Area','Phone','Last paid','Balance']];
      S.customers.map(c=>({c,b:balanceOf(c.id)})).sort((a,b)=>b.b-a.b).forEach(x=>
        rows.push([x.c.name,x.c.area||'',x.c.phone||'',lastPaidDate(x.c.id)||'',Math.round(x.b)]));
      offerCSV('outstanding-'+today()+'.csv', rows); break;
    }
  }
});

});

});
